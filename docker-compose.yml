services:
    app:
        image: ghcr.io/muhammad-febriansyah/takslist:latest
        restart: unless-stopped
        env_file:
            - .env
        environment:
            RUN_MIGRATIONS: '${RUN_MIGRATIONS:-false}'
        ports:
            - '${APP_PORT:-8000}:8080'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

